          example:
            deployments: write
            issues: read
        slug:
          type: string
          description: The slug name of the GitHub app
          example: probot-owners
        updated_at:
          type: string
          format: date-time
          example: '2017-07-08T16:18:44.0000000-04:00'
        webhook_secret:
          type: string
          nullable: true
          example: '"6fba8f2fc8a7e8f2cca5577eddd82ca7586b3b6b"'
      description: GitHub apps are a new way to extend GitHub. They can be installed directly on organizations and user accounts and granted access to specific repositories. They come with granular permissions and built-in webhooks. GitHub apps are first class actors within GitHub.
      nullable: true
    reaction-rollup:
      title: Reaction Rollup
      required:
        - url
        - total_count
        - '+1'
        - '-1'
        - laugh
        - confused
        - heart
        - hooray
        - eyes
        - rocket
      type: object
      properties:
        '+1':
          type: integer
        '-1':
          type: integer
        confused:
          type: integer
        eyes:
          type: integer
        heart:
          type: integer
        hooray:
          type: integer
        laugh:
          type: integer
        rocket:
          type: integer
        total_count:
          type: integer
        url:
          type: string
          format: uri
    repository:
      title: Repository
      required:
        - archive_url
        - assignees_url
        - blobs_url
        - branches_url
        - collaborators_url
        - comments_url
        - commits_url
        - compare_url
        - contents_url
        - contributors_url
        - deployments_url
        - description
        - downloads_url
        - events_url
        - fork
        - forks_url
        - full_name
        - git_commits_url
        - git_refs_url
        - git_tags_url
        - hooks_url
        - html_url
        - id
        - node_id
        - issue_comment_url
        - issue_events_url
        - issues_url
        - keys_url
        - labels_url
        - languages_url
        - merges_url
        - milestones_url
        - name
        - notifications_url
        - owner
        - private
        - pulls_url
        - releases_url
        - stargazers_url
        - statuses_url
