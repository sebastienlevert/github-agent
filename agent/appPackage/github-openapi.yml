openapi: 3.0.1
info:
  title: GitHub v3 REST API - Subset
  description: GitHub's v3 REST API.
  termsOfService: https://docs.github.com/articles/github-terms-of-service
  contact:
    name: Support
    url: https://support.github.com/contact?tags=dotcom-rest-api
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  version: '1.1.4'
  x-logo:
    url: https://api.apis.guru/v2/cache/logo/https_twitter.com_github_profile_image.jpeg
servers:
  - url: ${{GITHUB_API_URL}}
    description: The GitHub API
security:
  - GitHubOAuthConfig: []
paths:
  '/repos/{owner}/{repo}/issues/{issue_number}':
    patch:
      tags:
        - issues
      summary: Update an issue
      description: Issue owners and users with push access can edit an issue.
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/reference/issues#update-an-issue
      operationId: issues_update
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/issue-number'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee:
                  type: string
                  description: Username to assign to this issue. **This field is deprecated.**
                  nullable: true
                assignees:
                  type: array
                  items:
                    type: string
                  description: 'Usernames to assign to this issue. Pass one or more user logins to _replace_ the set of assignees on this issue. Send an empty array (`[]`) to clear all assignees from the issue. Only users with push access can set assignees for new issues. Without push access to the repository, assignee changes are silently dropped.'
                body:
                  type: string
                  description: The contents of the issue.
                  nullable: true
                labels:
                  type: array
                  items:
                    type: string
                  description: 'Labels to associate with this issue. Pass one or more labels to _replace_ the set of labels on this issue. Send an empty array (`[]`) to clear all labels from the issue. Only users with push access can set labels for issues. Without push access to the repository, label changes are silently dropped.'
                milestone:
                  type: string
                  nullable: true
                state:
                  enum:
                    - open
                    - closed
                  type: string
                  description: The open or closed state of the issue.
                state_reason:
                  enum:
                    - completed
                    - not_planned
                    - reopened
                  type: string
                  description: The reason for the state change. Ignored unless `state` is changed.
                  nullable: true
                  example: not_planned
                title:
                  type: string
                  description: The title of the issue.
                  nullable: true
            examples:
              default:
                value:
                  assignees:
                    - octocat
                  body: I'm having a problem with this.
                  labels:
                    - bug
                  milestone: 1
                  state: open
                  title: Found a bug
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/issue'
              examples:
                default:
                  $ref: '#/components/examples/issue'
        '301':
          $ref: '#/components/responses/moved_permanently'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '410':
          $ref: '#/components/responses/gone'
        '422':
          $ref: '#/components/responses/validation_failed'
        '503':
          $ref: '#/components/responses/service_unavailable'
  '/repos/{owner}/{repo}/issues/{issue_number}/assignees':
    post:
      tags:
        - issues
      summary: Add assignees to an issue
      description: Adds up to 10 assignees to an issue. Users already assigned to an issue are not replaced.
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/reference/issues#add-assignees-to-an-issue
      operationId: issues_add_assignees
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/issue-number'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assignees:
                  type: array
                  items:
                    type: string
                  description: 'Usernames of people to assign this issue to. _NOTE: Only users with push access can add assignees to an issue. Assignees are silently ignored otherwise._'
            examples:
              default:
                value:
                  assignees:
                    - hubot
                    - other_user
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/issue'
              examples:
                default:
                  $ref: '#/components/examples/issue'
components:
  securitySchemes:
    GitHubOAuthConfig:
      type: oauth2
      description: OAuth configuration for the GitHub API
      flows:
        authorizationCode:
          authorizationUrl: https://github.com/login/oauth/authorize
          tokenUrl: https://github.com/login/oauth/access_token
          scopes:
            public_repo: Read public repos
  schemas:
    issue:
      title: Issue
      required:
        - assignee
        - closed_at
        - comments
        - comments_url
        - events_url
        - html_url
        - id
        - node_id
        - labels
        - labels_url
        - milestone
        - number
        - repository_url
        - state
        - locked
        - title
        - url
        - user
        - author_association
        - created_at
        - updated_at
      type: object
      properties:
        active_lock_reason:
          type: string
          nullable: true
        assignee:
          $ref: '#/components/schemas/nullable-simple-user'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/simple-user'
          nullable: true
        author_association:
          $ref: '#/components/schemas/author-association'
        body:
          type: string
          description: Contents of the issue
          nullable: true
          example: 'It looks like the new widget form is broken on Safari. When I try and create the widget, Safari crashes. This is reproducible on 10.8, but not 10.9. Maybe a browser bug?'
        body_html:
          type: string
        body_text:
          type: string
        closed_at:
          type: string
          format: date-time
          nullable: true
        closed_by:
          $ref: '#/components/schemas/nullable-simple-user'
        comments:
          type: integer
        comments_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        draft:
          type: boolean
        events_url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri
        id:
          type: integer
        labels:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  color:
                    type: string
                    nullable: true
                  default:
                    type: boolean
                  description:
                    type: string
                    nullable: true
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  node_id:
                    type: string
                  url:
                    type: string
                    format: uri
          description: Labels to associate with this issue; pass one or more label names to replace the set of labels on this issue; send an empty array to clear all labels from the issue; note that the labels are silently dropped for users without push access to the repository
          example:
            - bug
            - registration
        labels_url:
          type: string
        locked:
          type: boolean
        milestone:
          $ref: '#/components/schemas/nullable-milestone'
        node_id:
          type: string
        number:
          type: integer
          description: Number uniquely identifying the issue within its repository
          example: 42
        performed_via_github_app:
          $ref: '#/components/schemas/nullable-integration'
        pull_request:
          required:
            - diff_url
            - html_url
            - patch_url
            - url
          type: object
          properties:
            diff_url:
              type: string
              format: uri
              nullable: true
            html_url:
              type: string
              format: uri
              nullable: true
            merged_at:
              type: string
              format: date-time
              nullable: true
            patch_url:
              type: string
              format: uri
              nullable: true
            url:
              type: string
              format: uri
              nullable: true
        reactions:
          $ref: '#/components/schemas/reaction-rollup'
        repository:
          $ref: '#/components/schemas/repository'
        repository_url:
          type: string
          format: uri
        state:
          type: string
          description: State of the issue; either 'open' or 'closed'
          example: open
        state_reason:
          enum:
            - completed
            - reopened
            - not_planned
          type: string
          description: The reason for the current state
          nullable: true
          example: not_planned
        timeline_url:
          type: string
          format: uri
        title:
          type: string
          description: Title of the issue
          example: Widget creation fails in Safari on OS X 10.8
        updated_at:
          type: string
          format: date-time
        url:
          type: string
          description: URL for the issue
          format: uri
          example: https://api.github.com/repositories/42/issues/1
        user:
          $ref: '#/components/schemas/nullable-simple-user'
      description: 'Issues are a great way to keep track of tasks, enhancements, and bugs for your projects.'
    nullable-simple-user:
      title: Simple User
      required:
        - avatar_url
        - events_url
        - followers_url
        - following_url
        - gists_url
        - gravatar_id
        - html_url
        - id
        - node_id
        - login
        - organizations_url
        - received_events_url
        - repos_url
        - site_admin
        - starred_url
        - subscriptions_url
        - type
        - url
      type: object
      properties:
        avatar_url:
          type: string
          format: uri
          example: https://github.com/images/error/octocat_happy.gif
        email:
          type: string
          nullable: true
        events_url:
          type: string
          example: 'https://api.github.com/users/octocat/events{/privacy}'
        followers_url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat/followers
        following_url:
          type: string
          example: 'https://api.github.com/users/octocat/following{/other_user}'
        gists_url:
          type: string
          example: 'https://api.github.com/users/octocat/gists{/gist_id}'
        gravatar_id:
          type: string
          nullable: true
          example: 41d064eb2195891e12d0413f63227ea7
        html_url:
          type: string
          format: uri
          example: https://github.com/octocat
        id:
          type: integer
          example: 1
        login:
          type: string
          example: octocat
        name:
          type: string
          nullable: true
        node_id:
          type: string
          example: MDQ6VXNlcjE=
        organizations_url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat/orgs
        received_events_url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat/received_events
        repos_url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat/repos
        site_admin:
          type: boolean
        starred_at:
          type: string
          example: '"2020-07-09T00:17:55Z"'
        starred_url:
          type: string
          example: 'https://api.github.com/users/octocat/starred{/owner}{/repo}'
        subscriptions_url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat/subscriptions
        type:
          type: string
          example: User
        url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat
      description: A GitHub user.
      nullable: true
    simple-user:
      title: Simple User
      required:
        - avatar_url
        - events_url
        - followers_url
        - following_url
        - gists_url
        - gravatar_id
        - html_url
        - id
        - node_id
        - login
        - organizations_url
        - received_events_url
        - repos_url
        - site_admin
        - starred_url
        - subscriptions_url
        - type
        - url
      type: object
      properties:
        avatar_url:
          type: string
          format: uri
          example: https://github.com/images/error/octocat_happy.gif
        email:
          type: string
          nullable: true
        events_url:
          type: string
          example: 'https://api.github.com/users/octocat/events{/privacy}'
        followers_url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat/followers
        following_url:
          type: string
          example: 'https://api.github.com/users/octocat/following{/other_user}'
        gists_url:
          type: string
          example: 'https://api.github.com/users/octocat/gists{/gist_id}'
        gravatar_id:
          type: string
          nullable: true
          example: 41d064eb2195891e12d0413f63227ea7
        html_url:
          type: string
          format: uri
          example: https://github.com/octocat
        id:
          type: integer
          example: 1
        login:
          type: string
          example: octocat
        name:
          type: string
          nullable: true
        node_id:
          type: string
          example: MDQ6VXNlcjE=
        organizations_url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat/orgs
        received_events_url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat/received_events
        repos_url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat/repos
        site_admin:
          type: boolean
        starred_at:
          type: string
          example: '"2020-07-09T00:17:55Z"'
        starred_url:
          type: string
          example: 'https://api.github.com/users/octocat/starred{/owner}{/repo}'
        subscriptions_url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat/subscriptions
        type:
          type: string
          example: User
        url:
          type: string
          format: uri
          example: https://api.github.com/users/octocat
      description: A GitHub user.
    author-association:
      title: author_association
      enum:
        - COLLABORATOR
        - CONTRIBUTOR
        - FIRST_TIMER
        - FIRST_TIME_CONTRIBUTOR
        - MANNEQUIN
        - MEMBER
        - NONE
        - OWNER
      type: string
      description: How the author is associated with the repository.
      example: OWNER
    nullable-milestone:
      title: Milestone
      required:
        - closed_issues
        - creator
        - description
        - due_on
        - closed_at
        - id
        - node_id
        - labels_url
        - html_url
        - number
        - open_issues
        - state
        - title
        - url
        - created_at
        - updated_at
      type: object
      properties:
        closed_at:
          type: string
          format: date-time
          nullable: true
          example: '2013-02-12T13:22:01.0000000+00:00'
        closed_issues:
          type: integer
          example: 8
        created_at:
          type: string
          format: date-time
          example: '2011-04-10T20:09:31.0000000+00:00'
        creator:
          $ref: '#/components/schemas/nullable-simple-user'
        description:
          type: string
          nullable: true
          example: Tracking milestone for version 1.0
        due_on:
          type: string
          format: date-time
          nullable: true
          example: '2012-10-09T23:39:01.0000000+00:00'
        html_url:
          type: string
          format: uri
          example: https://github.com/octocat/Hello-World/milestones/v1.0
        id:
          type: integer
          example: 1002604
        labels_url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World/milestones/1/labels
        node_id:
          type: string
          example: MDk6TWlsZXN0b25lMTAwMjYwNA==
        number:
          type: integer
          description: The number of the milestone.
          example: 42
        open_issues:
          type: integer
          example: 4
        state:
          enum:
            - open
            - closed
          type: string
          description: The state of the milestone.
          default: open
          example: open
        title:
          type: string
          description: The title of the milestone.
          example: v1.0
        updated_at:
          type: string
          format: date-time
          example: '2014-03-03T18:58:10.0000000+00:00'
        url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World/milestones/1
      description: A collection of related issues and pull requests.
      nullable: true
    nullable-integration:
      title: GitHub app
      required:
        - id
        - node_id
        - owner
        - name
        - description
        - external_url
        - html_url
        - created_at
        - updated_at
        - permissions
        - events
      type: object
      properties:
        client_id:
          type: string
          example: '"Iv1.25b5d1e65ffc4022"'
        client_secret:
          type: string
          example: '"1d4b2097ac622ba702d19de498f005747a8b21d3"'
        created_at:
          type: string
          format: date-time
          example: '2017-07-08T16:18:44.0000000-04:00'
        description:
          type: string
          nullable: true
          example: The description of the app.
        events:
          type: array
          items:
            type: string
          description: The list of events for the GitHub app
          example:
            - label
            - deployment
        external_url:
          type: string
          format: uri
          example: https://example.com
        html_url:
          type: string
          format: uri
          example: https://github.com/apps/super-ci
        id:
          type: integer
          description: Unique identifier of the GitHub app
          example: 37
        installations_count:
          type: integer
          description: The number of installations associated with the GitHub app
          example: 5
        name:
          type: string
          description: The name of the GitHub app
          example: Probot Owners
        node_id:
          type: string
          example: MDExOkludGVncmF0aW9uMQ==
        owner:
          $ref: '#/components/schemas/nullable-simple-user'
        pem:
          type: string
          example: '"-----BEGIN RSA PRIVATE KEY-----\nMIIEogIBAAKCAQEArYxrNYD/iT5CZVpRJu4rBKmmze3PVmT/gCo2ATUvDvZTPTey\nxcGJ3vvrJXazKk06pN05TN29o98jrYz4cengG3YGsXPNEpKsIrEl8NhbnxapEnM9\nJCMRe0P5JcPsfZlX6hmiT7136GRWiGOUba2X9+HKh8QJVLG5rM007TBER9/z9mWm\nrJuNh+m5l320oBQY/Qq3A7wzdEfZw8qm/mIN0FCeoXH1L6B8xXWaAYBwhTEh6SSn\nZHlO1Xu1JWDmAvBCi0RO5aRSKM8q9QEkvvHP4yweAtK3N8+aAbZ7ovaDhyGz8r6r\nzhU1b8Uo0Z2ysf503WqzQgIajr7Fry7/kUwpgQIDAQABAoIBADwJp80Ko1xHPZDy\nfcCKBDfIuPvkmSW6KumbsLMaQv1aGdHDwwTGv3t0ixSay8CGlxMRtRDyZPib6SvQ\n6OH/lpfpbMdW2ErkksgtoIKBVrDilfrcAvrNZu7NxRNbhCSvN8q0s4ICecjbbVQh\nnueSdlA6vGXbW58BHMq68uRbHkP+k+mM9U0mDJ1HMch67wlg5GbayVRt63H7R2+r\nVxcna7B80J/lCEjIYZznawgiTvp3MSanTglqAYi+m1EcSsP14bJIB9vgaxS79kTu\noiSo93leJbBvuGo8QEiUqTwMw4tDksmkLsoqNKQ1q9P7LZ9DGcujtPy4EZsamSJT\ny8OJt0ECgYEA2lxOxJsQk2kI325JgKFjo92mQeUObIvPfSNWUIZQDTjniOI6Gv63\nGLWVFrZcvQBWjMEQraJA9xjPbblV8PtfO87MiJGLWCHFxmPz2dzoedN+2Coxom8m\nV95CLz8QUShuao6u/RYcvUaZEoYs5bHcTmy5sBK80JyEmafJPtCQVxMCgYEAy3ar\nZr3yv4xRPEPMat4rseswmuMooSaK3SKub19WFI5IAtB/e7qR1Rj9JhOGcZz+OQrl\nT78O2OFYlgOIkJPvRMrPpK5V9lslc7tz1FSh3BZMRGq5jSyD7ETSOQ0c8T2O/s7v\nbeEPbVbDe4mwvM24XByH0GnWveVxaDl51ABD65sCgYB3ZAspUkOA5egVCh8kNpnd\nSd6SnuQBE3ySRlT2WEnCwP9Ph6oPgn+oAfiPX4xbRqkL8q/k0BdHQ4h+zNwhk7+h\nWtPYRAP1Xxnc/F+jGjb+DVaIaKGU18MWPg7f+FI6nampl3Q0KvfxwX0GdNhtio8T\nTj1E+SnFwh56SRQuxSh2gwKBgHKjlIO5NtNSflsUYFM+hyQiPiqnHzddfhSG+/3o\nm5nNaSmczJesUYreH5San7/YEy2UxAugvP7aSY2MxB+iGsiJ9WD2kZzTUlDZJ7RV\nUzWsoqBR+eZfVJ2FUWWvy8TpSG6trh4dFxImNtKejCR1TREpSiTV3Zb1dmahK9GV\nrK9NAoGAbBxRLoC01xfxCTgt5BDiBcFVh4fp5yYKwavJPLzHSpuDOrrI9jDn1oKN\nonq5sDU1i391zfQvdrbX4Ova48BN+B7p63FocP/MK5tyyBoT8zQEk2+vWDOw7H/Z\nu5dTCPxTIsoIwUw1I+7yIxqJzLPFgR2gVBwY1ra/8iAqCj+zeBw=\n-----END RSA PRIVATE KEY-----\n"'
        permissions:
          type: object
          properties:
            checks:
              type: string
            contents:
              type: string
            deployments:
              type: string
            issues:
              type: string
            metadata:
              type: string
          additionalProperties:
            type: string
